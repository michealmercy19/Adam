<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADAM Mobile Prototype</title>
<style>
:root{--blue:#1746d1;--ink:#172033;--muted:#667085;--bg:#f6f8fc;--line:#e7eaf0;--green:#16865b;--red:#d92d20}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:235px;background:#fff;border-right:1px solid var(--line);padding:22px 15px;z-index:5}.logo{font-size:25px;font-weight:900;color:var(--blue);margin-bottom:25px}.rolebox{background:#f4f6fb;border-radius:12px;padding:10px;margin-bottom:20px}.rolebox small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.rolebox select{width:100%;border:0;background:transparent;font-weight:700}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:10px;color:#667085;margin:2px 0;cursor:pointer}.nav button.active{background:#edf2ff;color:var(--blue);font-weight:800}
.main{margin-left:235px;padding:28px;min-height:100vh}.view{display:none}.view.active{display:block}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.title h1{margin:0 0 5px;font-size:28px}.title p{margin:0;color:var(--muted)}.pill,.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#edf2ff;color:var(--blue);font-size:11px;font-weight:800}.badge.good{background:#e8f7ef;color:var(--green)}.badge.pending{background:#fff4d6;color:#956b00}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 3px 12px rgba(20,35,70,.04)}.section{margin-top:14px}.metric{font-size:29px;font-weight:900;margin-top:7px}.muted{color:var(--muted);font-size:12px}.course,.listitem,.statline{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.course:last-child,.statline:last-child{border-bottom:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.ghost,.danger{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.ghost{background:#edf2ff;color:var(--blue)}.danger{background:#fee4e2;color:var(--red)}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #dfe3eb;border-radius:9px;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{background:#f2f5ff;border-left:3px solid var(--blue);padding:11px;border-radius:8px;font-size:12px}.scanbox{height:220px;border-radius:14px;background:#101828;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin:13px 0}.face{width:125px;height:155px;border:3px solid #fff;border-radius:50%}.scanline{position:absolute;left:8%;right:8%;height:2px;background:#78a2ff;animation:scan 2s infinite}@keyframes scan{0%{top:15%}50%{top:82%}100%{top:15%}}.progress{height:8px;background:#e8ebf2;border-radius:20px;overflow:hidden;margin:10px 0 14px}.progress div{height:100%;background:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px}
@media(max-width:850px){body{background:var(--bg)}.sidebar{top:0;bottom:auto;left:0;right:0;width:100%;height:64px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-right:0;border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(20,35,70,.07)}.logo{font-size:20px;margin:0}.rolebox{width:115px;margin:0;padding:5px 8px}.rolebox small{font-size:7px}.rolebox select{font-size:10px}.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:5px 3px;box-shadow:0 -4px 18px rgba(20,35,70,.08)}.nav button{flex:1;min-width:0;margin:0 1px;padding:6px 2px;text-align:center;font-size:8px;line-height:1.05}.nav button:before{display:block;font-size:17px;line-height:20px}.nav button:nth-child(1):before{content:"⌂"}.nav button:nth-child(2):before{content:"◉"}.nav button:nth-child(3):before{content:"▣"}.nav button:nth-child(4):before{content:"○"}.nav button:nth-child(5):before{content:"◈"}.nav button:nth-child(6):before{content:"▤"}.nav button:nth-child(7):before{content:"⚙"}.nav button:nth-child(8):before{content:"?"}.nav button.active{background:#edf2ff;color:var(--blue)}.main{margin:0;padding:82px 13px 88px}.grid{grid-template-columns:1fr 1fr;gap:9px}.two{grid-template-columns:1fr;gap:11px}.card{padding:13px;border-radius:14px}.metric{font-size:22px}.title h1{font-size:21px}.title p{font-size:11px}.formgrid{grid-template-columns:1fr}.tablewrap{overflow-x:auto}.tablewrap table{min-width:570px}}@media(max-width:370px){.grid{grid-template-columns:1fr}.rolebox{width:100px}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="logo">ADAM</div><div class="rolebox"><small>Prototype role</small><select id="role" onchange="setRole(this.value)"><option value="student">Student</option><option value="lecturer">Lecturer</option><option value="admin">Department Admin</option></select></div><div id="nav" class="nav"></div></aside><main class="main" id="main"></main></div>
<script>
const navs={student:[["s-home","Dashboard"],["s-attendance","Mark Attendance"],["s-history","History"],["s-profile","Profile"]],lecturer:[["l-dashboard","Dashboard"],["l-host","Host Class"],["l-attendance","Live Attendance"],["l-classes","My Classes"],["l-reports","Reports"]],admin:[["a-dashboard","Dashboard"],["a-users","Users"],["a-records","Search Records"],["a-reports","Reports"],["a-settings","Settings"],["a-complaints","Complaints"]]};
const P={};
P["s-home"]=`<div class="top"><div class="title"><h1>Good afternoon 👋</h1><p>Your attendance at a glance</p></div><span class="pill">Student</span></div><div class="grid"><div class="card"><div class="muted">Attendance</div><div class="metric">86%</div></div><div class="card"><div class="muted">Classes</div><div class="metric">24</div></div></div><div class="card section"><h3>Next class</h3><div class="course"><div><b>ICT 201 — Data Structures</b><div class="muted">10:00 AM · ICT 2</div></div><button class="primary" onclick="show('s-attendance')">Mark Attendance</button></div></div>`;
P["s-attendance"]=`<div class="top"><div class="title"><h1>Mark Attendance</h1><p>Face scan → details → biometrics → submit</p></div><span class="pill">Student</span></div><div class="card"><div id="step1"><h3>1. Facial Recognition</h3><p class="muted">A full facial match is not compulsory if the network is poor. ADAM only needs enough of the scan to continue.</p><div class="scanbox"><div class="face"></div><div class="scanline"></div></div><button class="primary" onclick="face()">Tap to Scan Face</button><button class="ghost" onclick="fallback()">Continue with Partial Scan</button><p id="faceMsg" class="muted">Waiting for scan…</p></div><div id="step2" style="display:none"><h3>2. Confirm Details</h3><div class="formgrid"><div class="field"><label>Name</label><input value="Adebayo Daniel" readonly></div><div class="field"><label>Matric</label><input value="FUNAAB/IT/24/001" readonly></div><div class="field"><label>Course</label><input value="ICT 201" readonly></div><div class="field"><label>Location</label><input value="Verified classroom" readonly></div></div><button class="primary" onclick="bioStep()">Continue to Biometrics</button></div><div id="step3" style="display:none"><h3>3. Final Biometric Verification</h3><div class="scanbox"><div style="font-size:70px">☝️</div><div class="scanline"></div></div><button class="primary" onclick="bio()">Verify Biometrics</button><p id="bioMsg" class="muted">Required before submission.</p><button id="submit" class="primary" style="display:none" onclick="submitAtt()">Submit Attendance</button></div></div>`;
P["s-history"]=`<div class="top"><div class="title"><h1>Attendance History</h1><p>Your recent classes</p></div></div><div class="card"><div class="course"><div><b>ICT 201</b><div class="muted">18 Aug · 10:04 AM</div></div><span class="badge good">On Time</span></div><div class="course"><div><b>ICT 203</b><div class="muted">17 Aug · 12:09 PM</div></div><span class="badge pending">Late</span></div></div>`;
P["s-profile"]=`<div class="top"><div class="title"><h1>My Profile</h1><p>Student account</p></div></div><div class="card"><h3>Adebayo Daniel</h3><p class="muted">FUNAAB/IT/24/001 · Information Technology</p><div class="statline"><span>Biometric status</span><span class="badge good">Verified</span></div><div class="statline"><span>Face profile</span><span class="badge good">Active</span></div></div>`;
P["l-dashboard"]=`<div class="top"><div class="title"><h1>Lecturer Dashboard</h1><p>Classes and live attendance</p></div><span class="pill">Lecturer</span></div><div class="grid"><div class="card"><div class="muted">Today's classes</div><div class="metric">4</div></div><div class="card"><div class="muted">Average attendance</div><div class="metric">82%</div></div></div><div class="card section"><h3>Quick actions</h3><div class="actions"><button class="primary" onclick="show('l-host')">Host / Schedule</button><button class="ghost" onclick="show('l-attendance')">Live Attendance</button><button class="ghost" onclick="show('l-reports')">Reports</button></div></div>`;
P["l-host"]=`<div class="top"><div class="title"><h1>Host / Schedule</h1><p>Simple class setup</p></div><span class="pill">Max 35 min</span></div><div class="two"><div class="card"><h3>Walk-in class</h3><div class="field"><label>Course</label><select id="course"><option>ICT 201 — Data Structures</option><option>ICT 203 — Database Systems</option></select></div><div class="field"><label>Venue</label><input id="room" placeholder="ICT 2"></div><div class="formgrid"><div class="field"><label>On Time</label><select id="on"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div><div class="field"><label>Late</label><select id="late"><option selected>5</option><option>10</option><option>15</option><option>20</option></select></div></div><p class="notice">Choose the two windows. ADAM calculates the total and blocks anything above 35 minutes.</p><button class="primary" onclick="startLive()">Start Walk-in</button></div><div class="card"><h3>Upcoming class</h3><div class="field"><label>Date</label><input type="date"></div><div class="field"><label>Time</label><input type="time"></div><div class="field"><label>Venue</label><input placeholder="ICT 4"></div><button class="primary" onclick="alert('Class scheduled successfully')">Schedule Class</button></div></div>`;
P["l-attendance"]=`<div class="top"><div class="title"><h1>Live Attendance</h1><p id="liveCourse">ICT 201 — Data Structures</p></div><span id="timing" class="pill">10 On Time · 5 Late</span></div><div class="notice">The lecturer controls the On-Time and Late windows. The total session cannot exceed 35 minutes.</div><div class="two section"><div class="card"><h3>Live verification</h3><div class="scanbox"><div class="face"></div><div class="scanline"></div></div><div class="actions"><button class="primary" onclick="count('onTime')">Simulate On Time</button><button class="ghost" onclick="count('late')">Simulate Late</button></div></div><div class="card"><h3>Session status</h3><div class="metric" id="timer">15:00</div><div class="muted">Time remaining</div><div class="progress"><div style="width:100%"></div></div><div class="statline"><span>On Time</span><b id="ot">64</b></div><div class="statline"><span>Late</span><b id="lt">0</b></div><div class="statline"><span>Absent</span><b>8</b></div><button class="danger" onclick="alert('Attendance ended. Report is ready.')">End Session</button></div></div>`;
P["l-classes"]=`<div class="top"><div class="title"><h1>My Classes</h1><p>Assigned courses and sessions</p></div></div><div class="card"><div class="course"><div><b>ICT 201</b><div class="muted">72 students · 86% average</div></div><button class="ghost" onclick="show('l-attendance')">Open</button></div><div class="course"><div><b>ICT 203</b><div class="muted">68 students · 81% average</div></div><button class="ghost">View</button></div></div>`;
P["l-reports"]=`<div class="top"><div class="title"><h1>Attendance Reports</h1><p>Export completed class records</p></div></div><div class="card"><div class="actions"><button class="primary" onclick="downloadCSV()">Download Spreadsheet</button><button class="ghost" onclick="window.print()">Export / Save PDF</button></div></div><div class="grid section"><div class="card"><div class="muted">Enrolled</div><div class="metric">72</div></div><div class="card"><div class="muted">On Time</div><div class="metric">58</div></div><div class="card"><div class="muted">Late</div><div class="metric">6</div></div><div class="card"><div class="muted">Absent</div><div class="metric">8</div></div></div>`;
P["a-dashboard"]=`<div class="top"><div class="title"><h1>Admin Dashboard</h1><p>Department-wide overview</p></div><span class="pill">Admin only</span></div><div class="grid"><div class="card"><div class="muted">Students</div><div class="metric">1,284</div></div><div class="card"><div class="muted">Lecturers</div><div class="metric">48</div></div><div class="card"><div class="muted">Courses</div><div class="metric">96</div></div><div class="card"><div class="muted">Attendance today</div><div class="metric">84%</div></div></div>`;
P["a-users"]=`<div class="top"><div class="title"><h1>Users</h1><p>Manage students and lecturers</p></div></div><div class="card"><div class="course"><div><b>Adebayo Daniel</b><div class="muted">Student · FUNAAB/IT/24/001</div></div><span class="badge good">Active</span></div><div class="course"><div><b>Dr. Adewale James</b><div class="muted">Lecturer · STAFF/ICT/014</div></div><span class="badge good">Active</span></div></div>`;
P["a-records"]=`<div class="top"><div class="title"><h1>Search Records</h1><p>Find any lecturer or student</p></div><span class="pill">Admin only</span></div><div class="card"><div class="field"><label>Name / Matric / Staff ID</label><input id="search" placeholder="Search"></div><button class="primary" onclick="adminSearch()">Search & Extract</button></div><div class="card section"><div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Role</th><th>ID</th><th>Attendance</th></tr></thead><tbody id="results"><tr><td>Adebayo Daniel</td><td>Student</td><td>FUNAAB/IT/24/001</td><td>86%</td></tr><tr><td>Dr. Adewale James</td><td>Lecturer</td><td>STAFF/ICT/014</td><td>—</td></tr></tbody></table></div></div>`;
P["a-reports"]=`<div class="top"><div class="title"><h1>Reports</h1><p>Department attendance analytics</p></div></div><div class="card"><div class="statline"><span>Students below 50%</span><b>73</b></div><div class="statline"><span>Courses with low attendance</span><b>8</b></div><div class="statline"><span>Attendance today</span><b>84%</b></div><button class="primary" onclick="downloadCSV()">Extract Report</button></div>`;
P["a-settings"]=`<div class="top"><div class="title"><h1>Settings</h1><p>Admin-only system controls</p></div></div><div class="card"><div class="statline"><span>Maximum attendance session</span><b>35 min</b></div><div class="statline"><span>Default On Time</span><b>10 min</b></div><div class="statline"><span>Default Late</span><b>5 min</b></div><div class="statline"><span>Facial recognition</span><span class="badge good">Enabled</span></div><div class="statline"><span>Final biometrics</span><span class="badge good">Required</span></div><div class="statline"><span>Network fallback</span><span class="badge good">Enabled</span></div></div>`;
P["a-complaints"]=`<div class="top"><div class="title"><h1>Complaints & Support</h1><p>Review and submit issues</p></div></div><div class="card"><div class="listitem"><b>FACIAL-024</b><span class="badge pending">Open</span></div><div class="listitem"><b>ATT-031</b><span class="badge pending">Open</span></div><div class="field"><label>New complaint</label><input id="complaint" placeholder="Describe the issue"></div><button class="primary" onclick="alert('Complaint submitted')">Submit Complaint</button></div>`;
function setRole(r){document.getElementById("nav").innerHTML=navs[r].map((x,i)=>`<button class="${i?'':'active'}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join("");show(navs[r][0][0])}
function show(id,btn){document.getElementById("main").innerHTML=P[id]||"";document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(btn)btn.classList.add("active")}
function face(){document.getElementById("faceMsg").textContent="✓ Scan captured. You can continue even if the network prevented a full match.";fallback()}
function fallback(){document.getElementById("step1").style.display="none";document.getElementById("step2").style.display="block"}
function bioStep(){document.getElementById("step2").style.display="none";document.getElementById("step3").style.display="block"}
function bio(){document.getElementById("bioMsg").textContent="✓ Biometrics verified successfully.";document.getElementById("submit").style.display="inline-block"}
function submitAtt(){document.getElementById("submit").textContent="Attendance Submitted ✓";document.getElementById("submit").disabled=true}
function startLive(){let a=+document.getElementById("on").value,b=+document.getElementById("late").value;if(a+b>35){alert("Maximum total attendance time is 35 minutes.");return}document.getElementById("liveCourse").textContent=document.getElementById("course").value+" · "+(document.getElementById("room").value||"Room");document.getElementById("timing").textContent=a+" On Time · "+b+" Late";show("l-attendance")}
function count(type){let id=type==="onTime"?"ot":"lt";document.getElementById(id).textContent=+document.getElementById(id).textContent+1}
function adminSearch(){let q=(document.getElementById("search").value||"").toLowerCase();let rows=[["Adebayo Daniel","Student","FUNAAB/IT/24/001","86%"],["Okafor Mercy","Student","FUNAAB/IT/24/014","84%"],["Dr. Adewale James","Lecturer","STAFF/ICT/014","—"]].filter(r=>!q||r.join(" ").toLowerCase().includes(q));document.getElementById("results").innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}
function downloadCSV(){let csv="Name,Role,ID,Attendance\nAdebayo Daniel,Student,FUNAAB/IT/24/001,86%\nDr. Adewale James,Lecturer,STAFF/ICT/014,-";let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="ADAM_Attendance_Report.csv";a.click()}
setRole("student");
</script></body></html>
